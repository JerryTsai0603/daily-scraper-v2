name: Daily Video Scraper

on:
  schedule:
    # UTC 22:00 (台灣時間 06:00) 與 UTC 14:00 (台灣時間 22:00)
    - cron: '0 14,22 * * *'
  workflow_dispatch: # 支援手動觸發

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 執行爬蟲、同步試算表與更新網頁
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python scraper.py
          touch .nojekyll # 防止 Jekyll 干擾靜態 HTML

      - name: 自動保存資料庫與網頁
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll || true
          if [ -f "videos.db" ]; then git add -f videos.db; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update database and index.html" && git push origin main)

      - name: 設定 GitHub Pages 資源環境
        uses: actions/configure-pages@v5

      - name: 打包網頁產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-crawler
    steps:
      - name: 正式發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
