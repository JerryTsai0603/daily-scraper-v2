name: Daily Video Scraper

on:
  schedule:
    # 每天定時自動執行一次（UTC 00:00，對應台灣時間早上 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援手動按鈕觸發執行

permissions:
  contents: write # 允許 GitHub Actions 將更新後的資料庫與網頁推回儲存庫

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 執行爬蟲、同步試算表與更新網頁
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python scraper.py

      - name: 自動將資料庫與網頁提交保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          git add index.html || true
          if [ -f "videos.db" ]; then git add videos.db; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update database and index.html" && git push)
