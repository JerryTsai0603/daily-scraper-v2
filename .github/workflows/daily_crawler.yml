name: Daily Video Scraper

on:
  schedule:
    # UTC 22:00 對應台灣時間 早上 06:00
    # UTC 14:00 對應台灣時間 晚上 22:00
    - cron: '0 14,22 * * *'
  workflow_dispatch: # 支援手動按鈕執行

permissions:
  contents: write    # 允許提交資料庫與 index.html 回儲存庫
  pages: write       # 允許直接發布至 GitHub Pages
  id-token: write    # 部署 GitHub Pages 所需的身份權限

# 確保同一時間只有一個 Pages 部署任務在執行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 執行爬蟲、同步試算表與更新網頁
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python scraper.py

      - name: 自動將資料庫與網頁提交保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          git add index.html || true
          if [ -f "videos.db" ]; then git add videos.db; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update database and index.html" && git push)

      - name: 設定 GitHub Pages 資源環境
        uses: actions/configure-pages@v5

      - name: 打包網頁檔案 (Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 將包含 index.html 的根目錄進行封裝上傳

      - name: 直接發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
