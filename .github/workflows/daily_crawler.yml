- name: 自動將資料庫與網頁提交保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          git add index.html || true
          if [ -f "videos.db" ]; then git add videos.db; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update database and index.html" && git push)
